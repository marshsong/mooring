name: hygiene

on:
  push:
  pull_request:

jobs:
  red-lines:
    name: Forbidden strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan app/src for forbidden strings
        shell: bash
        run: |
          set +e
          PATTERNS=("com.tencent.mm" "com\\.tencent\\.mm" "视频号" "plugin.finder" "FinderHome")
          HITS=""
          for p in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn -F -- "$p" app/src/ 2>/dev/null)
            if [ -n "$MATCHES" ]; then
              HITS="$HITS
              $MATCHES"
            fi
          done
          if [ -n "$HITS" ]; then
            echo "::error::Repository hygiene violation found in app/src:"
            echo "$HITS"
            exit 1
          fi
          echo "hygiene check passed: no forbidden strings in app/src"

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # android-actions/setup-android@v3 runs `sdkmanager tools`, which now
      # fails: the legacy `tools` package was dropped from the SDK repo.
      # The runner image already ships cmdline-tools, so install only what
      # AGP 8.7.3 needs (compileSdk 34).
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
