name: hygiene

on:
  push:
  pull_request:

jobs:
  red-lines:
    name: Forbidden strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan app/src for forbidden strings
        shell: bash
        run: |
          set +e
          PATTERNS=("com.tencent.mm" "com\\.tencent\\.mm" "视频号" "plugin.finder" "FinderHome")
          HITS=""
          for p in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn -F -- "$p" app/src/ 2>/dev/null)
            if [ -n "$MATCHES" ]; then
              HITS="$HITS
$MATCHES"
            fi
          done
          if [ -n "$HITS" ]; then
            echo "::error::Repository hygiene violation found in app/src:"
            echo "$HITS"
            exit 1
          fi
          echo "hygiene check passed: no forbidden strings in app/src"

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
