<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mooring 控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Mooring 拴马桩</span>
    <span id="statusBadge" class="badge">—</span>
    <span id="readonlyBadge" class="badge hidden">只读模式</span>
  </header>

  <!-- 配对视图 -->
  <section id="pairView" class="card hidden">
    <h1>配对电脑控制台</h1>
    <p>在手机引导页查看二维码或明文令牌，用电脑完成配对。令牌仅保存在本浏览器。</p>
    <div class="pair-actions">
      <button id="btnScan">摄像头扫码</button>
    </div>
    <video id="video" class="hidden" playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>
    <div id="scanMsg" class="hint"></div>
    <hr>
    <div class="manual">
      <input id="tokenInput" placeholder="手动粘贴令牌（32 位 hex）" autocomplete="off">
      <button id="btnPairManual">配对</button>
    </div>
    <div id="pairMsg" class="hint"></div>
  </section>

  <!-- 主界面 -->
  <section id="mainView" class="hidden">
    <nav class="tabs">
      <button data-tab="status" class="active">状态</button>
      <button data-tab="apps">应用</button>
      <button data-tab="groups">组</button>
      <button data-tab="rules">规则</button>
      <button data-tab="subs">订阅</button>
    </nav>
    <main>
      <div id="tab-status" class="tab active"></div>
      <div id="tab-apps" class="tab"></div>
      <div id="tab-groups" class="tab"></div>
      <div id="tab-rules" class="tab"></div>
      <div id="tab-subs" class="tab"></div>
    </main>
  </section>

  <script src="/vendor/jsqr.js"></script>
  <script src="/app.js"></script>
</body>
</html>
